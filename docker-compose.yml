services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PLAYWRIGHT: "${INSTALL_PLAYWRIGHT:-true}"
        INSTALL_OCR: "${INSTALL_OCR:-true}"
    container_name: investwatch-backend
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      REPORT_TRUSTED_PROXY: "${REPORT_TRUSTED_PROXY:-frontend}"
      REPORT_LIMIT_PER_MINUTE: "${REPORT_LIMIT_PER_MINUTE:-30}"
      HOSTING_ASN_DB: "${HOSTING_ASN_DB:-}"
      HOSTING_COUNTRY_DB: "${HOSTING_COUNTRY_DB:-}"
      APP_ENV: "${APP_ENV:-production}"
      DATA_DIR: "/app/data_seed"
      DATABASE_PATH: "/data/investwatch.db"
      OBJECT_STORE_DIR: "/data/object_store"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}"
      # Łączy się z Ollama uruchomioną natywnie na hoście (on-premise, bez płatnych API)
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma3:4b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      CRAWLER_ENABLE_SCHEDULER: "${CRAWLER_ENABLE_SCHEDULER:-true}"
      CRAWLER_SCHEDULE_MINUTES: "${CRAWLER_SCHEDULE_MINUTES:-15}"
      CRAWLER_CRON: "${CRAWLER_CRON:-}"
      CRAWLER_SCHEDULE_INCLUDE_MOCKS: "${CRAWLER_SCHEDULE_INCLUDE_MOCKS:-true}"
      CRAWLER_PROXIES: "${CRAWLER_PROXIES:-}"
      CRAWLER_USE_PLAYWRIGHT_FALLBACK: "${CRAWLER_USE_PLAYWRIGHT_FALLBACK:-false}"
      CRAWLER_PLAYWRIGHT_TIMEOUT_SECONDS: "${CRAWLER_PLAYWRIGHT_TIMEOUT_SECONDS:-20}"
      CRAWLER_PLAYWRIGHT_MIN_TEXT_CHARS: "${CRAWLER_PLAYWRIGHT_MIN_TEXT_CHARS:-400}"
      DEDUP_SIMILARITY_THRESHOLD: "${DEDUP_SIMILARITY_THRESHOLD:-0.92}"
      EVIDENCE_TSA_URL: "${EVIDENCE_TSA_URL:-}"
      HIGH_RISK_ALERT_THRESHOLD: "${HIGH_RISK_ALERT_THRESHOLD:-0.65}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-60}"
      OLLAMA_NUM_PREDICT: "${OLLAMA_NUM_PREDICT:-1024}"
      OLLAMA_NUM_THREAD: "${OLLAMA_NUM_THREAD:-10}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-4096}"
      OLLAMA_VISION_ENABLED: "${OLLAMA_VISION_ENABLED:-false}"
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-}"
      AI_PROMPT_CONTENT_CHARS: "${AI_PROMPT_CONTENT_CHARS:-9000}"
      AI_RAG_FEW_SHOT_ENABLED: "${AI_RAG_FEW_SHOT_ENABLED:-true}"
      AI_CLONE_SIMILARITY_THRESHOLD: "${AI_CLONE_SIMILARITY_THRESHOLD:-0.85}"
      AI_STRICT_QUOTE_VERIFICATION: "${AI_STRICT_QUOTE_VERIFICATION:-true}"
      AGGREGATOR_MULTI_MODULE_MODE: "${AGGREGATOR_MULTI_MODULE_MODE:-primary}"
      AGGREGATOR_SECONDARY_MIN_SCORE: "${AGGREGATOR_SECONDARY_MIN_SCORE:-0.55}"
      CRAWLER_EXPAND_SHORT_LINKS: "${CRAWLER_EXPAND_SHORT_LINKS:-false}"
      CRAWLER_EXPAND_SHORT_LINKS_MAX: "${CRAWLER_EXPAND_SHORT_LINKS_MAX:-5}"
      CRAWLER_TIMEOUT_SECONDS: "${CRAWLER_TIMEOUT_SECONDS:-12}"
      CRAWLER_MAX_BYTES: "${CRAWLER_MAX_BYTES:-2097152}"
      CRAWLER_MAX_REDIRECTS: "${CRAWLER_MAX_REDIRECTS:-5}"
      CRAWLER_RATE_LIMIT_SECONDS: "${CRAWLER_RATE_LIMIT_SECONDS:-0.5}"
      CRAWLER_RESPECT_ROBOTS: "${CRAWLER_RESPECT_ROBOTS:-true}"
      CRAWLER_ROBOTS_TTL_HOURS: "${CRAWLER_ROBOTS_TTL_HOURS:-24}"
      CRAWLER_PER_HOST_DELAY_SECONDS: "${CRAWLER_PER_HOST_DELAY_SECONDS:-2}"
      WATCHLIST_SEED_ON_START: "${WATCHLIST_SEED_ON_START:-true}"
      # Discovery przez lokalny SearXNG (profil "discovery"): DISCOVERY_ENABLED=true w .env
      DISCOVERY_ENABLED: "${DISCOVERY_ENABLED:-false}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://searxng:8080}"
      DISCOVERY_CRON: "${DISCOVERY_CRON:-0 */6 * * *}"
      DISCOVERY_QUERIES_PER_RUN: "${DISCOVERY_QUERIES_PER_RUN:-10}"
      DISCOVERY_RESULTS_PER_QUERY: "${DISCOVERY_RESULTS_PER_QUERY:-10}"
      DISCOVERY_MAX_NEW_URLS_PER_RUN: "${DISCOVERY_MAX_NEW_URLS_PER_RUN:-20}"
      DISCOVERY_REVISIT_DAYS: "${DISCOVERY_REVISIT_DAYS:-7}"
      DISCOVERY_DOMAIN_DENYLIST: "${DISCOVERY_DOMAIN_DENYLIST:-knf.gov.pl,gov.pl,wikipedia.org,wikimedia.org,google.com,bing.com,duckduckgo.com,europa.eu,esma.europa.eu,gpw.pl,nbp.pl}"
      KNF_REFRESH_CRON: "${KNF_REFRESH_CRON:-}"
      KNF_SYNC_USER_AGENT: "${KNF_SYNC_USER_AGENT:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - investwatch_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Ścieżka relatywna: przeglądarka woła /api/v1 i /ws/alerts na tym samym originie,
        # a Nginx przekazuje ruch do serwisu backend (brak CORS i mixed-content).
        REACT_APP_INVESTWATCH_API_URL: "/api/v1"
        REACT_APP_ALERT_THRESHOLD: "${HIGH_RISK_ALERT_THRESHOLD:-0.65}"
    container_name: investwatch-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Opcjonalny metawyszukiwarka do odkrywania nowych treści: docker compose --profile discovery up -d
  # (ustaw DISCOVERY_ENABLED=true w .env). Bez portu na hoście — dostępna tylko dla backendu.
  searxng:
    image: "searxng/searxng:${SEARXNG_IMAGE_TAG:-2026.11.21-c6ee3e9fd}"
    container_name: investwatch-searxng
    profiles: ["discovery"]
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-me}"
      SEARXNG_BASE_URL: "http://searxng:8080/"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Opcjonalny lokalny silnik AI w kontenerze: docker compose --profile ai up -d
  # (ustaw wtedy OLLAMA_BASE_URL=http://ollama:11434 w .env)
  ollama:
    image: "ollama/ollama:${OLLAMA_IMAGE_TAG:-0.12.6}"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
    container_name: investwatch-ollama
    profiles: ["ai"]
    volumes:
      - ollama_models:/root/.ollama
    # Dostęp do GPU NVIDIA (wymaga NVIDIA Container Toolkit / Docker Desktop z WSL2).
    # Na maszynie bez GPU NVIDIA usuń ten blok, inaczej kontener nie wystartuje.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Jednorazowe pobranie modeli do wolumenu ollama_models (kończy się po pobraniu)
  ollama-pull:
    image: "ollama/ollama:${OLLAMA_IMAGE_TAG:-0.12.6}"
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma3:4b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${OLLAMA_MODEL}\" && ollama pull \"$${OLLAMA_EMBED_MODEL}\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  investwatch_data:
  ollama_models:
